<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
        }

        body{
            background: #eceff1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 420px;
            height: 700px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:#fff;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,.2);


        }
        .header{
            background-color: rgb(255, 255, 255);
            color: #135683;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            padding: 18px;
            border-bottom: 1px solid #add;

        }
                    
        
        .chat-box{
            flex: ;
            overflow: auto;
            padding: 15px;
            background: #f5f5f5;
            
          
            
        }
        .bot{
            justify-content: flex-start;
        }

        .user{
            justify-content: flex-end;
        }


        .message{
            margin: 12px 0;
            display: flex;

        }

        .bubble{
            max-width: 75%;
            padding: 10px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.5;
        }

        .bot .bubble{
            background:#e5e7eb;
            color:#000;
        }

        .user .bubble{
            background:#2563eb;
            color:#fff;
        }
    </style>
</head>

<body>
    <div class="chat-container">
    <div class="header">
        My ChatBot
    </div>
    
    <div class="chat-box" id="chatbox">
        <div class="message">
            <div class="bubble">
                Hello <br>
                Ask Anything

            </div>
        </div>
    </div>
    

    </div>
</body>
</html>
