<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        #myImage{
            margin-left:35%;
        }

        .cable{
            width:6px;
            height:150px;
            background:rgb(255, 255, 255);
            margin-left:30;
        }

        button{
        margin-bottom:45px;
        animation:moveButton 2s infinite ease-in-out;
        }

        /* Button Animation */
        @keyframes moveButton{

            0%{
                transform:translateX(-20px);
            }

            50%{
                transform:translateX(20px);
            }

            100%{
                transform:translateX(-20px);
            }

    }


    </style>
</head>

<body>

    <div class="cable"></div>
     <img id="myImage" src="bulboff.png" width="500">
    <button style="margin-bottom: 45px;" onclick="
        if (document.getElementById('myImage').src.includes('bulboff.png'))
        {
            document.getElementById('myImage').src='bulbon.png';
        }
        else{
            document.getElementById('myImage').src='bulboff.png';
        }
        
        ">On / Off</button>
   
    
</body>
</html>
