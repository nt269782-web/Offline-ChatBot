<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb Animation</title>

    <style>

        body{
            background-color:rgb(0, 0, 0);
            margin:0;
            overflow:hidden;
            text-align:center;
        }

        /* Cable */
        .cable{
            width:6px;
            height:500px;
            background:rgb(240, 0, 0);
            margin-left:70%;
            position:relative;

            animation:swing 8s infinite ease-in-out;
            transform-origin:top center;
            transition: 0%;
        }

        .cableN{
            width:6px;
            height:400px;
            background:rgb(238, 10, 10);

            position:fixed;
            top:0;
            left:50%;

            transform:translateX(-50%);
        }
                /* Bulb */
        #myImage{
            width:500px;
            display:block;
            margin:auto;
            top: 315px;

            position:fixed;
            
            left:50%;
            transform:translateX(-50%);
        }

        /* Swing Animation */
        @keyframes swing{

            0%{
                transform:rotate(-10deg);
            }

            50%{
                transform:rotate(10deg);
            }

            100%{
                transform:rotate(-10deg);
            }

        }

        /* Button */
        button{
            position:absolute;
            top:500px;
            left:50%;
            transform:translateX(-50%);

            padding:12px 25px;
            font-size:20px;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

    </style>
</head>

<body>

    <div class="cable">

        <button onclick="
            if (document.getElementById('myImage').src.includes('bulboff.png'))
            {
                document.getElementById('myImage').src='bulbon.png';
            }
            else{
                document.getElementById('myImage').src='bulboff.png';
            }
        ">
        <img src="icon-removebg-preview (1).png" color="" width="200px">
        </button>

    </div>
    <div class="cableN">

    <img id="myImage" src="bulboff.png"></div>

</body>
</html>
