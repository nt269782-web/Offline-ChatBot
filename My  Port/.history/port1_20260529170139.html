<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb Animation</title>

    <style>

        body{
            background-color:black;
            margin:0;
            overflow:hidden;
            text-align:center;
        }

        /* Cable */
        .cable{
            width:6px;
            height:500px;
            background:white;
            margin-left:63%;
            position:relative;

            animation:swing 2s infinite ease-in-out;
            transform-origin:top center;
        }

        /* Bulb */
        #myImage{
            width:300px;
            display:block;
            margin:auto;
            top: 0%;
            height: 500p;
        }

        /* Swing Animation */
        @keyframes swing{

            0%{
                transform:rotate(-10deg);
            }

            50%{
                transform:rotate(10deg);
            }

            100%{
                transform:rotate(-10deg);
            }

        }

        /* Button */
        button{
            position:absolute;
            top:500px;
            left:50%;
            transform:translateX(-50%);

            padding:12px 25px;
            font-size:20px;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

    </style>
</head>

<body>

    <div class="cable">

        <button onclick="
            if (document.getElementById('myImage').src.includes('bulboff.png'))
            {
                document.getElementById('myImage').src='bulbon.png';
            }
            else{
                document.getElementById('myImage').src='bulboff.png';
            }
        ">
        On / Off
        </button>

    </div>

    <img id="myImage" src="bulboff.png">

</body>
</html>
