<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb Animation</title>

    <style>

        body{
            background-color:black;
            margin:0;
            overflow:hidden;
            text-align:center;
        }

        /* Cable */
        .cable{
            width:6px;
            height:220px;
            background:white;
            margin:auto;
        }

        /* Bulb */
        #myImage{
            width:300px;
            animation:swing 2s infinite ease-in-out;
            transform-origin:top center;
        }

        /* Swing Animation */
        @keyframes swing{

            0%{
                transform:rotate(-10deg);
            }

            50%{
                transform:rotate(10deg);
            }

            100%{
                transform:rotate(-10deg);
            }

        }

        /* Button */
        button{
            position:fixed;
            top:20px;
            left:20px;

            padding:12px 25px;
            font-size:20px;
            border:none;
            border-radius:10px;
            cursor:pointer;

            animation:moveButton 2s infinite ease-in-out;
        }

        /* Button Animation */
        @keyframes moveButton{

            0%{
                transform:translateX(-10px);
            }

            50%{
                transform:translateX(10px);
            }

            100%{
                transform:translateX(-10px);
            }

        }

    </style>
</head>

<body>

    <button onclick="
        if (document.getElementById('myImage').src.includes('bulboff.png'))
        {
            document.getElementById('myImage').src='bulbon.png';
        }
        else{
            document.getElementById('myImage').src='bulboff.png';
        }
    ">
    On / Off
    </button>

    <div class="cable"></div>

    <img id="myImage" src="bulboff.png">

</body>
</html>
